# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: New > Blueprint > conecte este repositório GitHub.
services:
  - type: web
    name: trk-mapa-patrimonial
    env: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: PORT
        value: '3000'
