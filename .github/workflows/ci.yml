name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The QA agent (npm run qa) is a hard quality gate: deploy only happens if all
# jobs below succeed. Render autoDeploy should be wired to the default branch so
# a red pipeline blocks the release.
jobs:
  quality:
    name: Lint • Typecheck • QA • Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (format check)
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: QA agent (domain integrity gate)
        run: npm run qa

      - name: Unit tests + coverage (>=80% on /lib)
        run: npm run test:coverage

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
